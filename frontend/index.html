<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#1a1218" />
    <meta
      name="description"
      content="Responder Debrief — get up to speed on a wildfire before deployment: perimeters, hotspots, spread forecasts, fire weather, and incident maps on one timeline."
    />
    <title>Responder Debrief</title>
    <script>
      // Theme before first paint: explicit choice wins, else dark (field default).
      try {
        var t = localStorage.getItem('rd-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
