<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Any http:// subresource request (including ones injected by browser
         extensions) is upgraded to https, so the page can never be flagged
         for mixed content. GitHub Pages can't set response headers; a meta
         CSP is the supported alternative for this directive. -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1218" />
    <meta
      name="description"
      content="Responder Brief — get up to speed on a wildfire before deployment: perimeters, hotspots, spread forecasts, fire weather, and incident maps on one timeline."
    />
    <title>Responder Brief</title>
    <script>
      // Theme before first paint: explicit choice wins, else dark (field default).
      try {
        var t = localStorage.getItem('rd-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
