[project]
name = "responder-worker"
version = "0.1.0"
description = "Responder Debrief data-pipeline worker: fire catalogs, FTP incident-map mirror, GeoPDF tiling, pyrecast run catalogs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "rapidfuzz>=3.9",
    "boto3>=1.34",
    "tenacity>=8.3",
    "pypdf>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["responder_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
