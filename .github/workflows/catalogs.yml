name: Sync catalogs

# Hourly: fire API + pyrecast capabilities -> pre-rendered WMS frames +
# catalog.json / pyrecast_runs.json / weather_runs.json on B2.
# Odd minute to dodge the GH scheduler rush.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  # Shared group: sync-catalogs and sync-incidents both read-modify-write
  # state/state.json AND catalogs/catalog.json. Running concurrently, the
  # later writer clobbers the other's update (observed: a mirror run wiped
  # the catalog run's backfilled counts). Serialize them.
  group: worker-b2-writes
  cancel-in-progress: false

jobs:
  sync-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "worker/uv.lock"

      - name: Install dependencies
        run: uv sync

      # HRRR weather frames need CLI GDAL (gdalwarp/gdaldem/gdal_calc.py)
      # Non-fatal: only the HRRR weather frames need GDAL. If the Ubuntu
      # mirror is crawling, skip it and still publish fire/forecast/incident
      # catalogs — the next hourly run picks the weather back up.
      - name: Install GDAL
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # A stalled Ubuntu mirror once hung this step for 30 min and the job
          # was killed before doing any work; the azure mirror has since been
          # flaky enough to skip several consecutive syncs. Bound it, retry,
          # fall back to the canonical archive, and let apt retry its fetches.
          for attempt in 1 2 3 4; do
            if [ "$attempt" = "3" ]; then
              echo "azure mirror still failing — switching to archive.ubuntu.com"
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            fi
            if sudo apt-get update -o Acquire::Retries=3 \
               && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 gdal-bin python3-gdal; then
              break
            fi
            echo "apt attempt $attempt failed — retrying"
            sleep 5
          done

      - name: Sync catalogs
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: responder-debrief-data
          B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
          # per-sync cap on pre-rendered frame images (default 3000)
          FRAME_BUDGET: ${{ vars.FRAME_BUDGET || '3000' }}
        run: uv run python -m responder_worker.cli sync-catalogs
