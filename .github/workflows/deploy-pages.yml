name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project-pages path prefix (repo name). Set the PAGES_BASE repo
          # variable to "/" when serving from a custom apex domain.
          VITE_BASE: ${{ vars.PAGES_BASE || '/responder_debrief/' }}
          # PostHog project key (public-safe). Analytics is fully disabled
          # when unset.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY || '' }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          # Directions/traffic (public-safe client keys; features degrade to
          # keyless community engines when unset)
          VITE_TOMTOM_KEY: ${{ vars.TOMTOM_KEY || '' }}
          VITE_ORS_KEY: ${{ vars.ORS_KEY || '' }}
          # e.g. https://f004.backblazeb2.com/file/responder-debrief-data
          VITE_DATA_BASE_URL: ${{ vars.VITE_DATA_BASE_URL }}
        run: npm run build

      # GitHub Pages has no rewrites — serve deep links (/fire/…, /health)
      # through the 404 page, which is just the app itself.
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
