name: Mirror incidents

# Hourly: FTP crawl -> match to active fires -> mirror PDFs -> GeoPDF tiles +
# IR vectors -> B2. Cheap when nothing changed (state skips unchanged dirs in
# milliseconds); hourly polling is what makes fresh sheets land near-publish.
# Odd minute, offset from catalogs (:07) and tile (:13).
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      fire:
        description: "Limit to one fire (slug), e.g. elk"
        required: false
        type: string
      since:
        description: "Backfill daily dirs since YYYYMMDD"
        required: false
        type: string
      force:
        description: "Force re-download / re-tile"
        required: false
        type: boolean
        default: false

concurrency:
  # Shared group: sync-catalogs and sync-incidents both read-modify-write
  # state/state.json AND catalogs/catalog.json. Running concurrently, the
  # later writer clobbers the other's update (observed: a mirror run wiped
  # the catalog run's backfilled counts). Serialize them.
  group: worker-b2-writes
  cancel-in-progress: false

jobs:
  sync-incidents:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL CLI tools
        # Mirroring works without GDAL (probing/tiling defer to the next
        # GDAL-equipped run) — a slow apt mirror must not kill the whole job.
        continue-on-error: true
        timeout-minutes: 9
        run: |
          # A stalled Ubuntu mirror once hung this step for 30 min and the job
          # was killed before doing any work; the azure mirror has since been
          # flaky enough to skip several consecutive syncs. Bound it, retry,
          # fall back to the canonical archive, and let apt retry its fetches.
          for attempt in 1 2 3 4; do
            if [ "$attempt" = "3" ]; then
              echo "azure mirror still failing — switching to archive.ubuntu.com"
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            fi
            if sudo apt-get update -o Acquire::Retries=3 \
               && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 gdal-bin python3-gdal poppler-utils; then
              break
            fi
            echo "apt attempt $attempt failed — retrying"
            sleep 5
          done

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "worker/uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Sync incidents
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: responder-debrief-data
          B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
          TILE_BUDGET: "40"
          MIRROR_MAX_SECONDS: ${{ vars.MIRROR_MAX_SECONDS || '1200' }}
          PRIORITY_FIRES: ${{ vars.PRIORITY_FIRES || 'big-grass' }}
          TILE_MAX_SECONDS: ${{ vars.TILE_MAX_SECONDS || '900' }}
          INPUT_FIRE: ${{ inputs.fire }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          FLAGS=()
          [ -n "$INPUT_FIRE" ] && FLAGS+=(--fire "$INPUT_FIRE")
          [ -n "$INPUT_SINCE" ] && FLAGS+=(--since "$INPUT_SINCE")
          [ "$INPUT_FORCE" = "true" ] && FLAGS+=(--force)
          uv run python -m responder_worker.cli sync-incidents "${FLAGS[@]}"
