name: Deploy WMS proxy (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/deploy-proxy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node is preinstalled on ubuntu-latest runners; tests.js has zero
      # dependencies, so there is no setup-node / npm ci step.
      - name: Test
        run: node proxy/tests.js

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 proxy/deploy.py
